name: Check live site

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  health:
    if: ${{ vars.PUBLIC_SITE_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check the public API and database
        env:
          SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
        run: |
          set -o pipefail
          curl --proto '=https' --fail --silent --show-error \
            --connect-timeout 5 --max-time 15 --retry 2 --retry-all-errors \
            "${SITE_URL%/}/api/health" | jq --exit-status '.status == "ok"'
