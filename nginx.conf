worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    server_tokens off;
    access_log off;
    client_body_temp_path /tmp/client-body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    map $http_x_forwarded_for $api_client {
        "" $binary_remote_addr;
        default $http_x_forwarded_for;
    }
    limit_req_zone $api_client zone=api_clients:1m rate=12r/s;

    server {
        listen 8080;
        root /usr/share/nginx/html;
        client_max_body_size 32k;
        add_header Content-Security-Policy "default-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        location /api/ {
            limit_req zone=api_clients burst=36 nodelay;
            limit_req_status 429;
            proxy_pass http://api:3000;
        }

        location ~ /\. { return 404; }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
